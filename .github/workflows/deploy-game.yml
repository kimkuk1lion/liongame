name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "liongame-main/**"
      - ".github/workflows/deploy-game.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: liongame-main/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: liongame-main

      - name: Build game
        run: npm run build
        working-directory: liongame-main

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: liongame-main/docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
